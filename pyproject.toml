[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Canonical quantitative platform data plane"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15",
  "psycopg[binary]>=3.1",
  "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["src"]
