        run: python tests/integration_adversarial_acceptance_postgres.py

  conformity-evidence-completion-postgres:
    name: Disposable PostgreSQL 17 conformity evidence completion test
    runs-on: ubuntu-latest
    # Two independent clusters make generated UUID inequality observable while
    # the same durable evidence is replayed under RB1 semantic equality.
    services:
      postgres_a:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: conformity_evidence_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conformity_evidence_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres_b:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: conformity_evidence_b
        ports:
          - 5433:5432
        options: >-
