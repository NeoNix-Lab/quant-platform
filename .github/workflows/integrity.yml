        run: python tests/integration_publication_eligibility_postgres.py

  adversarial-refusal-postgres:
    name: Disposable PostgreSQL 17 adversarial publication refusal test
    runs-on: ubuntu-latest
    # Adversarial acceptance evidence for PRODUCER_CONSUMER_CONFORMITY.md
    # §15.3 A2 (Bybit eligibility refusal) and A3 (gap/non-contiguous refusal).
    # Isolated like the sibling publication jobs: its own runner, its own
    # service container and its own database name, because the assertions are
    # exact row and evidence counts against one freshly initialized catalog.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: market_catalog_adversarial_refusal
        ports:
