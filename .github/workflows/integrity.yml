          DATA_GATEWAY_TEST_DSN: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/market_catalog_adversarial_refusal
        run: python tests/integration_adversarial_refusal_postgres.py

  adversarial-acceptance-postgres:
    name: Disposable PostgreSQL 17 adversarial publication acceptance test
    runs-on: ubuntu-latest
    # Adversarial acceptance evidence for PRODUCER_CONSUMER_CONFORMITY.md
    # §15.3 A1 (zero-event complete coverage) and A4 (supersession).
    # Exact row assertions require a freshly initialized isolated catalog.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: market_catalog_adversarial_acceptance
