      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conformity evidence dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Initialize catalog A
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: conformity_evidence_a
          PGPASSWORD: ci-postgres-password
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e POSTGRES_USER -e POSTGRES_DB -e PGPASSWORD \
            -e PGHOST -e PGPORT \
            postgres:17 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 -f /workspace/db/init/001_catalog.sql
      - name: Initialize catalog B
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: conformity_evidence_b
          PGPASSWORD: ci-postgres-password
          PGHOST: 127.0.0.1
          PGPORT: '5433'
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e POSTGRES_USER -e POSTGRES_DB -e PGPASSWORD \
            -e PGHOST -e PGPORT \
            postgres:17 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 -f /workspace/db/init/001_catalog.sql
      - name: Run conformity evidence completion PostgreSQL integration
        env:
          CONFORMITY_EVIDENCE_DSN_A: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/conformity_evidence_a
          CONFORMITY_EVIDENCE_DSN_B: postgresql://postgres:ci-postgres-password@127.0.0.1:5433/conformity_evidence_b
        run: python tests/integration_conformity_evidence_completion_postgres.py
