        options: >-
          --health-cmd "pg_isready -U postgres -d market_catalog_adversarial_refusal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install adversarial refusal test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Initialize catalog schema
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: market_catalog_adversarial_refusal
          PGPASSWORD: ci-postgres-password
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e POSTGRES_USER -e POSTGRES_DB -e PGPASSWORD \
            -e PGHOST -e PGPORT \
            postgres:17 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
