name: Close issue on PR merge

on:
  pull_request_target:
    types: [closed]
    branches:
      - 'implement/**'
      - 'main'

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issue:
    name: Close linked issue
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python - << 'EOF'
          import os
          import re
          import subprocess

          repo = os.environ.get("REPO", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          pr_body = os.environ.get("PR_BODY") or ""
          pr_head_ref = os.environ.get("PR_HEAD_REF") or ""
          base_ref = os.environ.get("BASE_REF") or ""

          # Issues labeled hold-until-main (governance closeouts, vertical/E2E
          # proof issues) must not close on an implement/<wave> merge -- they
          # only close for real once the wave promotes to main.
          HOLD_LABEL = "hold-until-main"

          issue_numbers = set()

          # 1. Match linking keywords in body: "Closes #123", "Closes #123, #124", "Fixes #123 and #124"
          keyword_pattern = r'(?i)\b(?:close[sd]?|fixe?[sd]?|resolve[sd]?)\s+((?:#\d+(?:[,\s]+(?:and\s+)?)*)+)'
          for match in re.finditer(keyword_pattern, pr_body):
              for num in re.findall(r'#(\d+)', match.group(0)):
                  issue_numbers.add(num)

          # 2. Match branch pattern like "agent/issue-123-45"
          branch_pattern = r'issue-(\d+)'
          branch_match = re.search(branch_pattern, pr_head_ref)
          if branch_match:
              issue_numbers.add(branch_match.group(1))

          if not issue_numbers:
              print(f"No linked issues found for PR #{pr_number}.")
              exit(0)

          for issue_num in sorted(issue_numbers, key=int):
              labels_res = subprocess.run(
                  ["gh", "issue", "view", issue_num, "--repo", repo,
                   "--json", "labels", "-q", ".labels[].name"],
                  capture_output=True,
                  text=True,
              )
              labels = set(labels_res.stdout.split())

              if HOLD_LABEL in labels and base_ref != "main":
                  print(f"Issue #{issue_num} is labeled '{HOLD_LABEL}'; leaving open despite merge into {base_ref}.")
                  hold_comment = (
                      f"PR #{pr_number} merged into `{base_ref}`, but this issue is held open "
                      f"until this wave promotes to `main` (labeled `{HOLD_LABEL}`)."
                  )
                  subprocess.run(
                      ["gh", "issue", "comment", issue_num, "--repo", repo, "--body", hold_comment],
                      capture_output=True,
                      text=True,
                  )
                  continue

              print(f"Closing issue #{issue_num} via PR #{pr_number}...")
              comment = f"Automatically closed by PR #{pr_number} merged into `{base_ref}`."
              res = subprocess.run(
                  ["gh", "issue", "close", issue_num, "--repo", repo, "--comment", comment],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0:
                  print(f"Successfully closed issue #{issue_num}.")
              else:
                  print(f"Failed to close issue #{issue_num}: {res.stderr.strip()}")
          EOF
